# Pruebas automaticas del motor analitico (CC-26, control de cambios, riesgo R6).
# Se ejecutan desde la carpeta backend, con el entorno virtual activo:
#   python -m pytest
# No usan PostgreSQL ni llaves externas; -p no:cacheprovider evita crear .pytest_cache.
[pytest]
testpaths = tests
addopts = -p no:cacheprovider
